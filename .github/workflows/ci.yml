name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Prototype smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          node --check app.js
          node --check data.js

      - name: Serve locally and run smoke tests
        run: |
          python3 -m http.server 4177 --bind 127.0.0.1 >/dev/null 2>&1 &
          server_pid=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4177/index.html >/dev/null && break
            sleep 0.5
          done
          node test-smoke.mjs http://127.0.0.1:4177
          kill "$server_pid"
